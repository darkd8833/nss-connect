<!-- 
    BLOOD TYPE DROPDOWN UPDATE
    Replace the existing blood type select in index.html with this code
    Location: In the volunteer registration modal (search for "Blood Group")
-->

<!-- UPDATED VERSION - Copy this exact code -->
<div>
    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Blood Group *</label>
    <select id="reg-blood" required class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:border-amber-600 text-slate-900">
        <option value="">-- Select Blood Group --</option>
        <option value="O+">O+ Positive</option>
        <option value="A+">A+ Positive</option>
        <option value="B+">B+ Positive</option>
        <option value="AB+">AB+ Positive</option>
        <option value="O-">O- Negative</option>
        <option value="A-">A- Negative</option>
        <option value="B-">B- Negative</option>
        <option value="AB-">AB- Negative</option>
        <option value="Others">Others / Not Specified</option>
    </select>
</div>
